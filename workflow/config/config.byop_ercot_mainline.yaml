# BYOP ERCOT Mainline v1.3 (work package 2026-10-21) - run configuration and E1 run gate.
# Read by byop/model/rearch_mech.py --mainline --config config/config.byop_ercot_mainline.yaml and byop/run/run_mainline.sh.
# The gate refuses EVERY optimizer call (S0-S3, calibrations, smoke / single-site LPs) unless
#   run_authorization == APPROVED, approved_git_sha is HEAD or an ancestor with no model / input / build / run change
#   since, and all code / input SHA-256 equal the pre-run manifest below.
# Only the researcher sets run_authorization: APPROVED and approved_git_sha (Stage A ends with NOT_APPROVED).
mainline:
  run_authorization: NOT_APPROVED
  approved_git_sha: null
  approved_by: null   # history: 01e761da -> single pilot_core_b3e (B3-E, done 2026-10-22 00:27 EDT); 8636c08d -> step0 (B1), pilot_s01 (B2); 4fb58a45 -> pilot_s01_fix (B2-R); reset for B2.5 (B3-E needs a new SHA)
  manifest: current_work_pckg/_completed/BYOP_ERCOT_Mainline_v1.3/MAINLINE_V13_PRE_RUN_MANIFEST.json
  stage: STAGE_B25_METHOD_AUDIT   # documentation label only (no behaviour)
  siting_variant: epoch8_legacy   # AIDC geospatial v1: frozen eight Epoch buses (B3-E); dynamic geography = config.byop_ercot_mainline_geo_dynamic_v1.yaml
  # E3 the only formal run (Stage B)
  case_id: MAINLINE_V13_GREAL_MID
  setting: G-REAL
  demand_scenario: mid
  start: 2026
  end: 2031
  sample_weeks: 26                # weeks 0 and 26 of the 2025 weather / load year, 3 h snapshots
  stress_days: 3                  # B7: low West wind + high load, max net load, winter peak (added to every period)
  stress_line_derate: 1.0         # B7 optional interface derate at stress snapshots (PROXY lever, 1.0 = off)
  poi_case: base                  # GREAL_POI_ASSUMPTIONS low / base / high columns
  gas_case: base
  byop_techs: [RICE, SOFC_NG, OCGT_aero, WIND, PV, BESS]   # D2 / D15; SOFC fast slots = 0 (D14), R pool empty (D14)
  scenarios: [S0, S1_EARLIEST, S3, S2, S3_mS2]             # S3_mS2 = S3 at the S2 service trajectory (M4 matched service, mandatory)
  attribution: true               # B8 single-factor relaxations on S1_EARLIEST: xPOI xUP xRA xPROC xALL
  tariff: energy
  threads: 6
  step0:                          # Stage B step 0 (solver, gated): re-derive the common baselines with the G-REAL background
    erm_calibration: true         #   ERM-02 B on the existing + committed fleet incl. the inherited ramp
    s0_min_uplift_calibration: true
inputs:
  research_cohorts: byop/inputs/dc/MAINLINE_RESEARCH_COHORTS_TAMU64.csv
  inherited_ramp: byop/inputs/dc/MAINLINE_INHERITED_RAMP_2025.csv
  reconciliation: byop/inputs/dc/MAINLINE_AIDC_RECONCILIATION.csv
  poi: byop/inputs/poi/GREAL_POI_ASSUMPTIONS.csv
  poi_equipment: byop/inputs/poi/GREAL_POI_E0_SCHEDULE.csv
  reuse_pool: byop/inputs/poi/GREAL_R_ASSET_POOL.csv
  renewable_potential: byop/inputs/grid/ERCOT_WIND_SOLAR_POTENTIAL.csv
  tech: byop/inputs/tech/MAINLINE_V13_TECH_DEFAULTS.csv
  gas: byop/inputs/tech/MAINLINE_V13_GAS_PRICES_2026_2031.csv
  baseline: results/BYOP/baseline_2025_tamu/baseline_2025_tamu_prepared.nc
