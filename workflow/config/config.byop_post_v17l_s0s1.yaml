# BYOP NEXT-09 (2026-10-23): the paired S0 (No New AIDC) -> S1_EARLIEST (Grid-Only) rerun on the v1.7L lossy 2025 baseline,
# ERCOT 16 research buses, 2026-2031, mid demand, single frozen weather year, LP only. Same A2 rules, run plan and acceptance as
# config.byop_post_v16_a2.yaml (consumed on v1.6, kept unchanged); only the baseline, the mainline config, the out_dir / ledgers,
# the manifest and the authorization source differ. Nothing is carried over from the v1.6 A2 run: S1's no-harm reference is the S0
# of THIS out_dir, solved on v1.7L under THIS config (post_v16_a2_gate.reference_binding_problems).
# This file is a REQUEST, not an approval. It runs only when (1) config.byop_baseline_registry.yaml says v17l ADOPTED and (2) the
# three fields below are set by the researcher (both may be one config-only commit).
post_v16:
  run_authorization: NOT_APPROVED
  approved_git_sha: null
  approved_by: null
  authorization_source: current_work_pckg/BYOP_NEXT_09_V17L_BASELINE_ADOPTION/NEXT_09_ADOPTION_INSTRUCTION_RECORD.md
  authorization_source_sha256: 37a489e7c8f4d980343ccfaaab66c79b2d503b1d2a68ec702af546120dca4c46   # LF content SHA
  manifest: current_work_pckg/BYOP_NEXT_09_V17L_BASELINE_ADOPTION/V17L_S0S1_PRE_RUN_MANIFEST.json
  stage: A2
  stages: [S0, S1_EARLIEST]        # order fixed: S1_EARLIEST only after S0 PASSED (ledger DONE / ok / optimal / pass + S0_RESULT.json)
  max_scenario_attempts: 2           # parent rows in A2_SOLVE_LOG.csv: S0, S1_EARLIEST
  max_top_level_optimizer_calls: 3   # child rows in A2_OPTIMIZER_CALL_LOG.csv: S0_COST, S1_SPEED_HIERARCHY (one Gurobi hierarchical
                                     # multi-objective call; its internal objective passes are audit metadata), S1_COST
  optimizer_call_plan: {S0: [S0_COST], S1_EARLIEST: [S1_SPEED_HIERARCHY, S1_COST]}
  max_retries: 0
  mainline_config: config/config.byop_ercot_mainline_geo_dynamic_v1_baseline_v17l.yaml
  out_dir: results/BYOP/post_v17l_s0s1/POST_V17L_S0S1
  baseline:
    path: workflow/results/BYOP/baseline_2025_tamu_v17_lossy/baseline_2025_tamu_v17_lossy_prepared.nc   # L2 only, no fallback
    sha256: f9aa87aea496f7c07ea4aca0439a703e7eaa90d08cb66c5bc6f149ea60eeefb6
  loss_basis: "transmission_losses 2 in the v1.7L calibration (NEXT-08b v3) AND in this solve (baseline meta; registry loss-basis rule)"
  design:
    snapshots: "3 h; sample_weeks 26 (weeks 0 and 26) + B7 stress days; stores weighting = elapsed 3 h (NEXT-02 A2-FIX-03)"
    reserve: {requirement_MW: 3000, tau_h: 1, response_window_min: 10, storage_energy: "end AND start of every snapshot on the dispatch SOC"}
    soc_segments: "NEXT-03 A2-FIX-08: every contiguous segment (sampled week / stress event) ends at >= the SOC PyPSA carries into it -> no net energy across time gaps or periods"
    no_harm: "S1 existing-customer shed <= frozen S0 shed of THIS run per load_shed unit x snapshot + 0.001 MW (D24)"
    public_expansion: "AC_exp fwd / rev equal capacity (M2-line_sym), fwd priced once, corridor cumulative cap (M2-line_cap)"
    committed_assets: "DWB Stage 2 + PBRP-765-A/B fixed in S0-S3; absolute cost ledger outside the objective (inputs/grid/COMMITTED_PUBLIC_ASSET_COSTS.csv)"
    legacy_off: [ERM-02 B, 15 % snapshot ERM, shadow SOC, S0CAL]
  solver: gurobi
  solver_options: "as rearch_mech / v240 M.solve (Method 2 barrier; Crossover per the existing mainline path); threads from THREADS"
  acceptance: {termination: optimal, balance_residual_MW_max: 1.0e-3, reserve_slack_MW_min: -1.0e-3, no_harm_excess_MW_max: 2.0e-3, no_harm_reference: 'S0_NO_HARM_REFERENCE.csv of THIS out_dir (SHA in S0_RESULT.json, no fill)',
               expansion_pair_max_abs_diff_MW: 1.0e-3, free_public_links_built_MW_max: 1.0e-3}
