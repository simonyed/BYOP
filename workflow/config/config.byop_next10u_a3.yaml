# BYOP NEXT-10U (2026-10-24): A3 of model version engineering_cost_v1 = S3 (coordinated social optimum) / S2 (developer-led BYOP,
# speed-first then private cost, 1-3 iterations) / S3_mS2 (S3 at the S2_final service, matched-service audit) on the ADOPTED v1.7L
# lossy 2025 baseline, ERCOT 16 research buses, 2026-2031, mid demand, LP only.
# Routed through post_v16_a3_gate / post_v16_a3_runtime (rearch_mech --post-v16 --a3-config ...). S2 needs the solved S1 network in
# memory, so the A3 process re-solves S0 and S1_EARLIEST first; they must reproduce the accepted NEXT-10U S0 / S1 results
# (reference below, SHA-pinned after those solves) at the same thread count, or A3 stops. Later no-harm rows use the SHA-pinned
# NEXT-10U S0 reference, never the re-solve, never v1.6 / NEXT-09.
# Same physical feasible set in S2 and S3 (one network build path, same engineering POI candidates, leads, caps, gas / permit
# evidence, firm rule). S2 private cost adds the CIAC + 25.194 security financing of its firm import right (S2_PRIVATE_GRID_RIGHT_CHARGES);
# S3 / S2-public / S3_mS2 objectives carry real resource cost only (no CIAC, no security principal).
# Approval: researcher chat instruction of 2026-10-24 (authorization_source); set only in a config-only commit after the reference
# SHAs and the A3 manifest are frozen.
post_v16:
  run_authorization: NOT_APPROVED
  approved_git_sha: null
  approved_by: null
  authorization_source: current_work_pckg/BYOP_NEXT_10U/NEXT_10U_INSTRUCTION_RECORD.md
  authorization_source_sha256: d02c7fdf7fa71963a0320b0fbe938e7607506ff11bd0dbbe7efda16f2c2f8a53   # LF content SHA
