# BYOP NEXT-08b loss-upper fix (2026-10-23): lossy 2025 LP1 calibration v3 - identical to v2 (config.byop_lossy_lp1_v2.yaml: same raw
# network, fleet, load, objective, prices, losses 2, cap 2 x v1.6, parallel-circuit r proxy fixed per LP, convergence thresholds,
# guards G1-G3, LP2 check and acceptance, tangents at 1/2 and 1 x s_max_pu x S_ref) EXCEPT the loss upper bound (loss_upper:
# affine_s_ref): loss <= r_pu (2 R_ref R - R_ref^2), R = s_max_pu s_nom (variable), R_ref = s_max_pu S_ref - the affine tangent of the
# LP2 bound r_pu R^2 at S_ref (equal to LP2 at s_nom = S_ref; never above r_pu R^2; never limits a flow the rating row allows for
# s_nom >= 0.75 S_ref) - plus the explicit trust floor s_nom >= max(raw, 0.75 S_ref); a line ending on a floor above raw is not
# converged. Own out_dir / ledger / manifest / budget; every earlier ledger, candidate and result is untouched.
# This file is a REQUEST: only the researcher authorises it.
